
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Entity Filter Dashboard</title>

<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

<style>

body {
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
}

header {
    background:#111827;
    color:white;
    text-align:center;
    padding:20px;
}

.container {
    padding:20px;
}

.filters {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.box,.card,.chart {
    background:white;
    border-radius:10px;
    padding:15px;
    box-shadow:0 2px 5px rgba(0,0,0,0.08);
}

select,input {
    width:100%;
    padding:10px;
    border-radius:8px;
    margin-top:8px;
    border:1px solid #ccc;
}

.cards {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.card h2 {
    margin:0;
    font-size:30px;
}

.chart {
    margin-bottom:20px;
}

table {
    width:100%;
    border-collapse:collapse;
}

th,td {
    border:1px solid #ddd;
    padding:8px;
}

th {
    background:#111827;
    color:white;
    position:sticky;
    top:0;
    z-index:100;
}

.table-container {
    max-height:500px;
    overflow:auto;
}

</style>
</head>

<header>
<h1>Executive Gujrat Delimitation Dashboard</h1>
</header>

<div class="container">

<div class="filters">

<div class="box">
<label><b>Local Body Type</b></label>
<select id="typeFilter"></select>
</div>

<div class="box">
<label><b>Entity</b></label>
<select id="entityFilter"></select>
</div>

<div class="box">
<label><b>Union Council</b></label>
<select id="ucFilter"></select>
</div>

</div>

<div class="box" style="margin-bottom:20px;">
<label><b>Search Area Name</b></label>
<input type="text" id="areaSearch"
placeholder="Search Electoral Area">
</div>

<div class="cards">

<div class="card">
<h2 id="populationCard"></h2>
<p>Filtered Population</p>
</div>

<div class="card">
<h2 id="avgBlockCard"></h2>
<p>Average Block Size</p>
</div>

<div class="card">
<h2 id="largestBlockCard"></h2>
<p>Largest Block Population</p>
<div id="largestBlockArea"></div>
</div>

</div>

<div class="chart">
<div id="lgChart"></div>
</div>

<div class="chart">

<h2>Top 5 Populated UCs</h2>

<table id="topUCTable">

<thead>
<tr>
<th>UC No</th>
<th>Local Government</th>
<th>Total Population</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

</table>

const colors = [
    "#2563eb",
    "#16a34a",
    "#dc2626",
    "#ca8a04",
    "#9333ea"
];

const typeFilter =
    document.getElementById("typeFilter");

const entityFilter =
    document.getElementById("entityFilter");

const ucFilter =
    document.getElementById("ucFilter");

const areaSearch =
    document.getElementById("areaSearch");

function uniqueValues(rows,key){
    return [...new Set(rows.map(r=>r[key]))]
        .filter(v => v !== null && v !== "")
        .sort();
}

function fillDropdown(dropdown, values, selected="All"){

    dropdown.innerHTML = "";

    const allOpt =
        document.createElement("option");

    allOpt.value = "All";
    allOpt.textContent = "All";

    dropdown.appendChild(allOpt);

    values.forEach(v => {
        const opt =
            document.createElement("option");

        opt.value = v;
        opt.textContent = v;

        dropdown.appendChild(opt);
    });

    dropdown.value = selected;
}

function getFilteredData(){

    const searchText =
        areaSearch.value.toLowerCase();

    return data.filter(r => {

        const typeOk =
            typeFilter.value === "All" ||
            r["Type"] == typeFilter.value;

        const entityOk =
            entityFilter.value === "All" ||
            r["Entity"] == entityFilter.value;

        const ucOk =
            ucFilter.value === "All" ||
            r["UC No"] == ucFilter.value;

        const searchOk =
            !searchText ||
            String(
                r["Electoral Area / Revenue Estate"] || ""
            )
            .toLowerCase()
            .includes(searchText);

        return typeOk &&
               entityOk &&
               ucOk &&
               searchOk;
    });
}

function refreshFilters(){

    const currentType =
        typeFilter.value || "All";

    const currentEntity =
        entityFilter.value || "All";

    const currentUC =
        ucFilter.value || "All";

    fillDropdown(
        typeFilter,
        uniqueValues(data,"Type"),
        currentType
    );

    const entityRows =
        data.filter(r =>
            currentType === "All" ||
            r["Type"] == currentType
        );

    fillDropdown(
        entityFilter,
        uniqueValues(entityRows,"Entity"),
        currentEntity
    );

    const ucRows =
        data.filter(r => {

            const typeOk =
                currentType === "All" ||
                r["Type"] == currentType;

            const entityOk =
                currentEntity === "All" ||
                r["Entity"] == currentEntity;

            return typeOk && entityOk;
        });

    fillDropdown(
        ucFilter,
        uniqueValues(ucRows,"UC No"),
        currentUC
    );
}

function updateDashboard(){

    refreshFilters();

    const rows = getFilteredData();

    const totalPop =
        rows.reduce((a,b)=>
            a + Number(b["Population"] || 0),0);

    document.getElementById("populationCard")
        .innerText =
        totalPop.toLocaleString();

    const avgBlock =
        rows.length > 0
        ? totalPop / rows.length
        : 0;

    document.getElementById("avgBlockCard")
        .innerText =
        Math.round(avgBlock).toLocaleString();

    let largest =
        rows.sort((a,b)=>
            Number(b["Population"]) -
            Number(a["Population"])
        )[0];

    if(largest){
        document.getElementById(
            "largestBlockCard"
        ).innerText =
            Number(largest["Population"])
            .toLocaleString();

        document.getElementById(
            "largestBlockArea"
        ).innerHTML =
            "<small>" +
            largest["Electoral Area / Revenue Estate"] +
            "</small>";
    }

    // Local Government Graph

    let lgData = {};

    rows.forEach(r => {

        const key =
            r["Local Government"] || "Unknown";

        lgData[key] =
            (lgData[key] || 0) +
            Number(r["Population"] || 0);

    });

    Plotly.newPlot("lgChart",[{

        x:Object.keys(lgData),
        y:Object.values(lgData),
        type:"bar",

        marker:{
            color:colors
        }

    }],{

        title:"Population of Local Government"

    });

    // Top UC Table

    let ucData = {};

    rows.forEach(r => {

        const key =
            r["UC No"] +
            "||" +
            r["Local Government"];

        ucData[key] =
            (ucData[key] || 0) +
            Number(r["Population"] || 0);

    });

    const topUCs =
        Object.entries(ucData)
        .sort((a,b)=>b[1]-a[1])
        .slice(0,5);

    const ucTableBody =
        document.querySelector(
            "#topUCTable tbody"
        );

    ucTableBody.innerHTML = "";

    topUCs.forEach(item => {

        const parts = item[0].split("||");

        const tr =
            document.createElement("tr");

        tr.innerHTML = `
            <td>${parts[0]}</td>
            <td>${parts[1]}</td>
            <td>${Number(item[1]).toLocaleString()}</td>
        `;

        ucTableBody.appendChild(tr);
    });

    // Filtered records table

    const tbody =
        document.querySelector("#table tbody");

    tbody.innerHTML = "";

    rows.forEach(r => {

        const tr =
            document.createElement("tr");

        tr.innerHTML = `
            <td>${r["Local Government"] || ""}</td>
            <td>${r["Type"] || ""}</td>
            <td>${r["Entity"] || ""}</td>
            <td>${r["UC No"] || ""}</td>
            <td>${r["Electoral Area / Revenue Estate"] || ""}</td>
            <td>${r["Census Block Code"] || ""}</td>
            <td>${Number(r["Population"] || 0).toLocaleString()}</td>
        `;

        tbody.appendChild(tr);
    });
}

typeFilter.addEventListener(
    "change",
    updateDashboard
);

entityFilter.addEventListener(
    "change",
    updateDashboard
);

ucFilter.addEventListener(
    "change",
    updateDashboard
);

areaSearch.addEventListener(
    "keyup",
    updateDashboard
);

fillDropdown(
    typeFilter,
    uniqueValues(data,"Type")
);

fillDropdown(
    entityFilter,
    uniqueValues(data,"Entity")
);

fillDropdown(
    ucFilter,
    uniqueValues(data,"UC No")
);

updateDashboard();

</script>
